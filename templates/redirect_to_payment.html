{% extends 'base.html' %}
{% block title %}Redirection vers le paiement{% endblock %}
{% block content %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
Swal.fire({
  icon: 'warning',
  title: '⚠️ Aucune carte de paiement trouvée',
  text: 'Redirection vers la page de paiement dans 5 secondes...',
  toast: true,
  position: 'top-end',
  showConfirmButton: false,
  timer: 5000,
  timerProgressBar: true,
  didClose: () => {
    window.location.href = "/user/{{ secure_token|urlencode }}/payment/";
  }
});
</script>
<div class="container text-center mt-5">
  <div class="alert alert-warning p-4 shadow-sm">
    <h4 class="mb-3">⚠️ Aucune carte de paiement trouvée</h4>
    <p>Veuillez ajouter une carte de paiement pour procéder à votre réservation.</p>
    <p class="text-muted">Redirection dans quelques instants...</p>
  </div>
</div>
{% endblock %}
