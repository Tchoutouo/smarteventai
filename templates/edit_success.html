{% extends 'base.html' %}
{% block title %}Profil mis à jour{% endblock %}

{% block content %}
<div class="container text-center mt-5">
  <h3 class="text-success">✅ Profil mis à jour avec succès!</h3>
  <p>Vous serez déconnecté dans <span id="countdown">5</span> secondes...</p>
  <a href="{% url 'logout' %}" class="btn btn-outline-danger mt-3">Se déconnecter maintenant</a>
</div>

<script>
let seconds = 5;
const countdown = document.getElementById("countdown");
const interval = setInterval(() => {
  seconds--;
  countdown.textContent = seconds;
  if (seconds === 0) {
    clearInterval(interval);
    window.location.href = "{% url 'logout' %}";
  }
}, 1000);
</script>
{% endblock %}
